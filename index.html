<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        color: #1e293b;
        background: #eef2ff;
      }

      main {
        width: 100%;
        max-width: 420px;
        padding: 32px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 12px 35px #1e293b15;
      }

      h1 {
        margin: 0 0 8px;
      }

      .descricao {
        margin: 0 0 24px;
        color: #64748b;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
      }

      input:focus {
        outline: 2px solid #6366f1;
        outline-offset: 2px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }

      button:focus-visible {
        outline: 3px solid #818cf8;
        outline-offset: 3px;
      }

      #mensagem {
        margin: 18px 0 0;
        color: #166534;
        line-height: 1.5;
      }

      #mensagem:empty {
        display: none;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Crie sua conta</h1>
      <p class="descricao">Preencha os campos para testar o cadastro.</p>

      <form id="formulario">
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          autocomplete="name"
          required
        />

        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="voce@exemplo.com"
          autocomplete="email"
          required
        />

        <label for="senha">Senha (mínimo de 8 caracteres)</label>
        <input
          type="password"
          id="senha"
          name="senha"
          minlength="8"
          autocomplete="new-password"
          required
        />

        <label for="confirmacao">Confirme sua senha</label>
        <input
          type="password"
          id="confirmacao"
          name="confirmacao"
          minlength="8"
          autocomplete="new-password"
          required
        />

        <button type="submit">Cadastrar</button>
      </form>

      <p id="mensagem" role="status"></p>
    </main>

    <script>
      const formulario = document.getElementById('formulario');
      const nome = document.getElementById('nome');
      const senha = document.getElementById('senha');
      const confirmacao = document.getElementById('confirmacao');
      const mensagem = document.getElementById('mensagem');

      function validarCampos() {
        nome.setCustomValidity(nome.value.trim() ? '' : 'Digite seu nome.');

        confirmacao.setCustomValidity(
          confirmacao.value === senha.value
            ? ''
            : 'As senhas precisam ser iguais.'
        );
      }

      formulario.addEventListener('input', () => {
        mensagem.textContent = '';
        validarCampos();
      });

      formulario.addEventListener('submit', (evento) => {
        evento.preventDefault();
        validarCampos();

        if (!formulario.reportValidity()) {
          return;
        }

        mensagem.textContent =
          `Tudo certo, ${nome.value.trim()}! ` +
          'Cadastro validado nesta demonstração. Nenhum dado foi salvo.';

        formulario.reset();
      });
    </script>
  </body>
</html>
